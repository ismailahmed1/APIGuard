services:
  api:
    image: apiguard-tasks-api:local
    ports: !override
      - "127.0.0.1:8012:8000"
    environment:
      DEBUG: "false"
      SENTRY_DSN: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 4s
      retries: 45
