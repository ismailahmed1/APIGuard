name: nexstock
# Pinned upstream revision in apps/nexstock/Dockerfile; update both together.
app_commit: 616e053ebda66294f5d3532dae4b3d752acc6cb0
base_url: http://127.0.0.1:8000
spec_location: http://127.0.0.1:8000/openapi.json

timeouts:
  request_seconds: 10
  run_seconds: 120

auth:
  login_path: /api/auth/login
  token_path: data.access_token
  username_field: email
  roles:
    admin:
      email_env: NEXSTOCK_ADMIN_EMAIL
      password_env: NEXSTOCK_ADMIN_PASSWORD
    manager:
      email_env: NEXSTOCK_MANAGER_EMAIL
      password_env: NEXSTOCK_MANAGER_PASSWORD

reset:
  command:
    - docker
    - compose
    - -f
    - apps/nexstock/compose.yaml
    - run
    - --rm
    - reset

# Security monitoring (FR-11): the logs of the API container and the rules to apply.
monitor:
  logs_command: [docker, compose, -f, apps/nexstock/compose.yaml, logs, --no-color, --no-log-prefix, api]
  rules: configs/monitor/rules.yaml

# Test generation with the AI model (apiguard generate).
generation:
  model: claude-opus-5-5
  effort: medium
  context_file: apps/nexstock/context.md
  limits:
    max_calls: 10
    max_output_tokens: 150000
    max_cost_usd: 5.00

# Schemathesis baseline (apiguard baseline), run inside the Compose network.
baseline:
  docker_network: apiguard-nexstock_default
  spec_url: http://api:8000/openapi.json
  base_url: http://api:8000
  role: admin
  max_examples: 25
  seed: 4907
  timeout_seconds: 900
